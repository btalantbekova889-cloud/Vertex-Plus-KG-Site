    <text x="4" y="66" font-size="58" letter-spacing="0.5" font-style="italic" fill="#16283A">VERTEX</text>
    <text x="318" y="42" font-size="22" letter-spacing="0.5" font-style="italic" fill="#FF6600">KG</text>
    <text x="66" y="150" font-size="58" letter-spacing="0.5" font-style="italic" fill="#16283A">PLUS</text>
