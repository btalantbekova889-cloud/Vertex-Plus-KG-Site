<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 190" fill="none" role="img" aria-labelledby="vertexLogoTitle">
  <title id="vertexLogoTitle">VERTEX PLUS KG — Добывающая компания</title>

  <!-- Wordmark -->
  <g font-family="Oswald, 'Arial Narrow', sans-serif" font-weight="700">
    <text x="4" y="64" font-size="56" letter-spacing="0.5" font-style="italic" fill="#16283A">VERTEX</text>
    <text x="228" y="42" font-size="21" letter-spacing="0.5" font-style="italic" fill="#FF6600">KG</text>
    <text x="64" y="146" font-size="56" letter-spacing="0.5" font-style="italic" fill="#16283A">PLUS</text>
  </g>
  <g font-family="Oswald, sans-serif" font-weight="600" letter-spacing="1">
    <text x="7" y="86" font-size="14" fill="#FF6600">ДОБЫВАЮЩАЯ</text>
    <text x="7" y="102" font-size="14" fill="#FF6600">КОМПАНИЯ</text>
  </g>

  <!-- Speed-line accent connecting the wordmark to the boom -->
  <path d="M6 25 L268 4" stroke="#FF6600" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Excavator arm mark -->
  <g transform="translate(250,0)">
    <!-- boom (angular, tapered) -->
    <path d="M4 172 L98 8 L112 20 L18 182 Z" fill="#FF6600"/>
    <!-- stick (angular, tapered) -->
    <path d="M100 10 L182 82 L172 98 L110 28 Z" fill="#FF6600"/>
    <!-- boom highlight -->
    <path d="M18 158 L82 40" stroke="#FFA366" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <!-- hydraulic cylinder on the stick -->
    <path d="M124 40 L156 76" stroke="#DB5600" stroke-width="4" stroke-linecap="round"/>
    <!-- elbow linkage bracket -->
    <path d="M100 10 L120 16 L106 30 Z" fill="#16283A"/>
    <!-- bucket -->
    <path d="M165 76 L212 92 L221 112 L211 134 L196 148 L188 137 L182 148 L178 137 L174 141 L155 122 L150 100 Z" fill="#FF6600"/>
    <!-- elbow pivot -->
    <circle cx="100" cy="10" r="9" fill="#FFFFFF" stroke="#16283A" stroke-width="2.5"/>
    <!-- bucket pivot -->
    <circle cx="178" cy="90" r="6" fill="#FFFFFF" stroke="#16283A" stroke-width="2"/>
  </g>
</svg>
