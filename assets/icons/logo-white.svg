<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 190" fill="none" role="img" aria-labelledby="vertexLogoWhiteTitle">
  <title id="vertexLogoWhiteTitle">VERTEX PLUS KG — Добывающая компания</title>

  <!-- Wordmark -->
  <g font-family="Oswald, 'Arial Narrow', sans-serif" font-weight="700">
    <text x="4" y="64" font-size="56" letter-spacing="0.5" font-style="italic" fill="#FFFFFF">VERTEX</text>
    <text x="228" y="42" font-size="21" letter-spacing="0.5" font-style="italic" fill="#FF6600">KG</text>
    <text x="64" y="146" font-size="56" letter-spacing="0.5" font-style="italic" fill="#FFFFFF">PLUS</text>
  </g>
  <g font-family="Oswald, sans-serif" font-weight="600" letter-spacing="1">
    <text x="7" y="86" font-size="14" fill="#FF6600">ДОБЫВАЮЩАЯ</text>
    <text x="7" y="102" font-size="14" fill="#FF6600">КОМПАНИЯ</text>
  </g>

  <!-- Speed-line accent connecting the wordmark to the boom -->
  <path d="M6 25 L258 4" stroke="#FF6600" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Excavator arm mark -->
  <g transform="translate(250,0)">
    <path d="M8 150 L92 8 L165 80" stroke="#FF6600" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M36 119 L86 33" stroke="#DB5600" stroke-width="5" stroke-linecap="round"/>
    <path d="M92 8 L110 15 L100 26 Z" fill="#FFFFFF"/>
    <path d="M151 68 L195 84 L201 102 L192 122 L185 133 L182 123 L176 134 L173 124 L169 127 L147 110 L142 90 Z" fill="#FF6600"/>
    <circle cx="92" cy="8" r="8" fill="#FFFFFF" stroke="#DB5600" stroke-width="2.5"/>
  </g>
</svg>
