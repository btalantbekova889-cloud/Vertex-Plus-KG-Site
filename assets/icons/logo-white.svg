<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 190" fill="none" role="img" aria-labelledby="vertexLogoWhiteTitle">
  <title id="vertexLogoWhiteTitle">VERTEX PLUS KG — Добывающая компания</title>

  <!-- Wordmark -->
  <g font-family="Oswald, 'Arial Narrow', sans-serif" font-weight="700">
    <text x="4" y="64" font-size="56" letter-spacing="0.5" font-style="italic" fill="#FFFFFF">VERTEX</text>
    <text x="228" y="42" font-size="21" letter-spacing="0.5" font-style="italic" fill="#FF6600">KG</text>
    <text x="64" y="146" font-size="56" letter-spacing="0.5" font-style="italic" fill="#FFFFFF">PLUS</text>
  </g>
  <g font-family="Oswald, sans-serif" font-weight="600" letter-spacing="1">
    <text x="7" y="86" font-size="14" fill="#FF6600">ДОБЫВАЮЩАЯ</text>
    <text x="7" y="102" font-size="14" fill="#FF6600">КОМПАНИЯ</text>
  </g>

  <!-- Speed-line accent connecting the wordmark to the boom -->
  <path d="M6 25 L268 4" stroke="#FF6600" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Excavator arm mark -->
  <g transform="translate(250,0)">
    <path d="M8 165 L100 5 L180 85" stroke="#FF6600" stroke-width="21" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M16 138 L76 34" stroke="#FFA366" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <path d="M100 5 L120 13 L108 25 Z" fill="#FFFFFF"/>
    <path d="M165 72 L212 90 L220 110 L210 132 L202 144 L198 133 L191 146 L187 135 L182 139 L158 120 L152 98 Z" fill="#FF6600"/>
    <circle cx="100" cy="5" r="9" fill="#FFFFFF" stroke="#DB5600" stroke-width="2.5"/>
  </g>
</svg>
